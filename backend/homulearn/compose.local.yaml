name: homulearn-local

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: homulearn_dev
      POSTGRES_USER: ${DB_USER:-homulearn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - homulearn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  homulearn_pgdata:
