name: HomuLearn CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  privacy-check:
    name: Privacy & Secret Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure private docs and .env are not tracked
        run: |
          TRACKED=$(git ls-files docs AGENTS.md backend/homulearn/.env)
          if [ -n "$TRACKED" ]; then
            echo "ERROR: Private files tracked in Git:"
            echo "$TRACKED"
            exit 1
          fi

  backend-test:
    name: Backend Test & Jar
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: homulearn_test
          POSTGRES_USER: homulearn
          POSTGRES_PASSWORD: homulearn
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Grant execute permission for gradlew
        working-directory: backend/homulearn
        run: chmod +x gradlew
      - name: Run Spring Boot tests
        working-directory: backend/homulearn
        env:
          DB_URL: jdbc:postgresql://localhost:55432/homulearn_test
          DB_USER: homulearn
          DB_PASSWORD: homulearn
        run: ./gradlew test --no-daemon
      - name: Build bootJar
        working-directory: backend/homulearn
        run: ./gradlew bootJar --no-daemon

  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
